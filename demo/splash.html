<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lattice117 — Presented by Brierley Sovereign Group</title>
<link rel="icon" type="image/png" sizes="32x32" href="./brand/glyph-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="./brand/mark-180.png">
<style>
  /* ===================================================================
     THE SPLASH

     Company first, product second. BSG presents; Lattice117 is what is
     being presented. They never share a frame at equal weight.

     EVERYTHING HERE IS CSS OVER TWO STILL IMAGES. There is no video file
     and no animation library, for the same reason the rest of this
     product has no dependencies: a splash screen that has to fetch an
     MP4 cannot be the first thing a visitor sees after they turn their
     Wi-Fi off, which is the one demonstration this whole product rests
     on. The motion is a masked specular sweep, a bloom that travels the
     wave, and a counter-rotating tick ring — composited over the real
     artwork rather than replacing it.

     WHY MASKED RATHER THAN OVERLAID. `mask-image` with the logo's own
     alpha means the highlight only ever lands ON the mark: it catches
     the metal rim and the rust and stops dead at the transparent edge,
     instead of sliding across a rectangle the logo happens to sit in.
     That is the difference between a shine and a flashlight.
     =================================================================== */

  :root{
    --bg:#05070b;
    --ink:#e8eef6;
    --ink-dim:#93a3b8;
    --cyan:#38bdf8;
    --cyan-hot:#7dd3fc;
    --rust:#c2632c;
    --rule:rgba(148,163,184,.22);

    /* Easing. Declared here because a `var()` that resolves to nothing
       makes the whole `animation` shorthand invalid rather than falling
       back — which is how the "Presented by" line spent its first
       outing at opacity 0. */
    --e-out:cubic-bezier(.16,1,.3,1);
    --e-inout:cubic-bezier(.65,0,.35,1);

    /* One place to retime the whole sequence. The beats below are
       offsets into this, so changing the total does not desynchronise
       them. */
    --t-total:6.4s;
  }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font:400 16px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    display:grid;
    place-items:center;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }

  /* Ambient field. Two very large, very slow radial washes — cyan from
     the product mark, a trace of rust from the rim — so the black is not
     flat. Kept under 8% opacity: the moment you can point at it, it is
     too strong. */
  .field{
    position:fixed;inset:0;pointer-events:none;
    background:
      radial-gradient(60% 50% at 50% 42%, rgba(56,189,248,.075), transparent 70%),
      radial-gradient(45% 40% at 68% 62%, rgba(194,99,44,.05), transparent 70%);
    animation:breathe 9s ease-in-out infinite;
  }
  @keyframes breathe{0%,100%{opacity:.75}50%{opacity:1}}

  .stage{
    position:relative;
    width:min(92vw,720px);
    aspect-ratio:1/1;
    max-height:86vh;
    display:grid;
    place-items:center;
  }

  .scene{
    position:absolute;inset:0;
    display:grid;
    place-items:center;
    opacity:0;
  }

  /* ---- Scene 1 — the company ------------------------------------- */

  .bsg{gap:0;grid-template-rows:auto auto;align-content:center}
  .bsg .presents{
    font-size:.66rem;letter-spacing:.42em;text-transform:uppercase;
    color:var(--ink-dim);margin:0 0 1.6rem;text-align:center;
    opacity:0;animation:fade-up .8s var(--e-out) .25s forwards;
  }
  .bsg img{
    width:min(62%,430px);height:auto;display:block;margin:0 auto;
    opacity:0;
    /* Scale from slightly large rather than slightly small: a mark that
       settles INTO place reads as arrival, one that grows reads as a
       pop-up. */
    animation:crest-in 1.5s cubic-bezier(.16,1,.3,1) .1s forwards;
  }
  @keyframes crest-in{
    from{opacity:0;transform:scale(1.045);filter:blur(6px)}
    to  {opacity:1;transform:scale(1);filter:blur(0)}
  }
  @keyframes fade-up{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  /* ---- Scene 2 — the product ------------------------------------- */

  .mark{position:relative;width:min(78%,520px);aspect-ratio:1/1}
  .mark img{width:100%;height:100%;display:block}

  /* The specular sweep. A narrow bright band travelling diagonally,
     clipped to the logo's own alpha, in `overlay` so it brightens the
     metal and the rust without washing the dark interior flat. */
  .sheen{
    position:absolute;inset:0;pointer-events:none;
    mix-blend-mode:overlay;
    background:linear-gradient(115deg,
      transparent 38%,
      rgba(255,255,255,.00) 44%,
      rgba(255,255,255,.55) 50%,
      rgba(255,255,255,.00) 56%,
      transparent 62%);
    background-size:260% 260%;
    -webkit-mask-image:url("./brand/mark-512.webp");
            mask-image:url("./brand/mark-512.webp");
    -webkit-mask-size:100% 100%;  mask-size:100% 100%;
    -webkit-mask-repeat:no-repeat; mask-repeat:no-repeat;
  }

  /* The wave bloom. A soft cyan disc that travels the arc the wave
     actually takes — down the right side and back across the bottom —
     masked the same way, in `screen` so it reads as the water catching
     light rather than a spotlight on top of it. */
  .bloom{
    position:absolute;inset:0;pointer-events:none;
    mix-blend-mode:screen;
    background:radial-gradient(circle 26% at 50% 50%, rgba(125,211,252,.42), rgba(56,189,248,.14) 45%, transparent 70%);
    background-repeat:no-repeat;
    background-size:100% 100%;
    -webkit-mask-image:url("./brand/mark-512.webp");
            mask-image:url("./brand/mark-512.webp");
    -webkit-mask-size:100% 100%;  mask-size:100% 100%;
    -webkit-mask-repeat:no-repeat; mask-repeat:no-repeat;
  }

  /* The tick ring. Drawn rather than cropped from the artwork, because
     rotating the artwork would rotate the wordmark with it. Counter-
     rotating pair: the eye reads two speeds as mechanism and one speed
     as a spinner. */
  .ring{position:absolute;inset:-5.5%;pointer-events:none}
  .ring circle{
    fill:none;stroke:var(--cyan);opacity:.34;
    /* An SVG element's transform-origin is the user-space origin, NOT its own
       centre, so `rotate()` swung these around the top-left corner and threw
       most of each ring out of frame. `fill-box` plus 50% 50% makes them spin
       about themselves, which is what "rotating ring" means. */
    transform-box:fill-box;
    transform-origin:50% 50%;
  }
  .ring .outer{animation:spin 26s linear infinite}
  .ring .inner{animation:spin 17s linear infinite reverse;opacity:.2;stroke:var(--rust)}
  @keyframes spin{to{transform:rotate(360deg)}}

  .wordmark{
    position:absolute;left:50%;bottom:-3.2rem;transform:translateX(-50%);
    text-align:center;white-space:nowrap;
  }
  .wordmark .tag{
    margin:0;font-size:.64rem;letter-spacing:.34em;text-transform:uppercase;
    color:var(--ink-dim);
  }
  .wordmark .rule{
    width:0;height:1px;margin:.85rem auto 0;background:var(--rule);
  }

  /* ---- The sequence ------------------------------------------------
     Named beats on one timeline. Percentages of --t-total so the whole
     thing retimes from one variable.

       0     BSG in
       26%   BSG out
       32%   Lattice117 in
       100%  hold
  ------------------------------------------------------------------- */

  .scene-bsg{animation:scene-bsg var(--t-total) linear forwards}
  @keyframes scene-bsg{
    0%{opacity:0}
    4%{opacity:1}
    24%{opacity:1}
    31%{opacity:0}
    100%{opacity:0}
  }

  .scene-l117{animation:scene-l117 var(--t-total) linear forwards}
  @keyframes scene-l117{
    0%,29%{opacity:0}
    38%{opacity:1}
    100%{opacity:1}
  }

  /* The mark's own entrance, delayed to its beat. */
  .scene-l117 .mark{
    opacity:0;
    animation:mark-in 1.2s cubic-bezier(.16,1,.3,1) calc(var(--t-total)*.30) forwards;
  }
  @keyframes mark-in{
    from{opacity:0;transform:scale(.94) rotate(-2.5deg);filter:blur(8px)}
    to  {opacity:1;transform:none;filter:blur(0)}
  }

  /* Sweep and bloom start only once the mark has arrived, then loop. */
  .sheen{
    background-position:130% 130%;
    animation:sweep 3.4s cubic-bezier(.45,0,.2,1) calc(var(--t-total)*.38) infinite;
  }
  @keyframes sweep{
    0%  {background-position:135% 135%}
    55% {background-position:-35% -35%}
    100%{background-position:-35% -35%}
  }

  .bloom{
    opacity:0;
    animation:travel 4.6s ease-in-out calc(var(--t-total)*.40) infinite;
  }
  /* Traces the wave: enters top-right, falls down the right flank,
     sweeps left along the trough, fades out under the wordmark. */
  @keyframes travel{
    0%  {opacity:0;   background-position:72% 6%}
    18% {opacity:.95; background-position:86% 30%}
    46% {opacity:.85; background-position:78% 68%}
    72% {opacity:.55; background-position:44% 82%}
    100%{opacity:0;   background-position:26% 74%}
  }

  .wordmark .tag{
    opacity:0;
    animation:fade-up .9s cubic-bezier(.16,1,.3,1) calc(var(--t-total)*.46) forwards;
  }
  .wordmark .rule{
    animation:draw 1.1s cubic-bezier(.16,1,.3,1) calc(var(--t-total)*.42) forwards;
  }
  @keyframes draw{to{width:clamp(180px,26vw,300px)}}

  /* ---- Accessibility ----------------------------------------------
     `prefers-reduced-motion` is not "turn the animation down". A splash
     is a delay with a picture on it; for someone who has asked for no
     motion the honest version is the final frame, immediately. No
     sweep, no bloom, no ring rotation, no cross-fade.
  ------------------------------------------------------------------- */
  @media (prefers-reduced-motion:reduce){
    .scene-bsg{display:none}
    .scene-l117,.scene-l117 .mark,.wordmark .tag{animation:none;opacity:1;transform:none;filter:none}
    .wordmark .rule{animation:none;width:clamp(180px,26vw,300px)}
    .sheen,.bloom,.field{display:none}
    .ring .outer,.ring .inner{animation:none}
  }

  /* Print: the final frame, no field wash. */
  @media print{
    .scene-bsg,.sheen,.bloom,.field{display:none}
    .scene-l117{opacity:1;animation:none}
    body{background:#fff}
  }
</style>
</head>
<body>

<div class="field" aria-hidden="true"></div>

<!-- One live region carries the whole splash for assistive tech: the
     visual sequence is decoration, the two names are the content. -->
<div class="stage" role="img"
     aria-label="Lattice117, presented by Brierley Sovereign Group">

  <div class="scene scene-bsg bsg" aria-hidden="true">
    <p class="presents">Presented by</p>
    <img src="./brand/bsg-crest-560.webp" width="560" height="428"
         alt="" decoding="async">
  </div>

  <div class="scene scene-l117" aria-hidden="true">
    <div class="mark">
      <img src="./brand/mark-512.webp" width="512" height="512"
           alt="" decoding="async">
      <div class="sheen"></div>
      <div class="bloom"></div>
      <svg class="ring" viewBox="0 0 100 100" aria-hidden="true">
        <!-- The two dash periods (5.2 and 5.4 user units) are deliberately
             close but not equal, so the rings drift against each other
             instead of locking into one pattern the eye reads as a single
             spinner. -->
        <circle class="outer" cx="50" cy="50" r="49"
                stroke-width=".55" stroke-dasharray="1.8 3.4" stroke-linecap="round"/>
        <circle class="inner" cx="50" cy="50" r="46.4"
                stroke-width=".45" stroke-dasharray="1.1 4.3" stroke-linecap="round"/>
      </svg>
      <div class="wordmark">
        <p class="tag">Deterministic schedule verification</p>
        <div class="rule"></div>
      </div>
    </div>
  </div>

</div>

<script type="module">
/**
 * The splash as a gate, not a decoration.
 *
 * A loading screen that runs for a fixed time whether or not anything is
 * loading is a delay someone chose to inflict. This one resolves on the
 * LATER of two things: the sequence reaching its final frame, and the
 * work the caller handed it. If the engine is ready in 200 ms the splash
 * still plays out — a brand beat that gets cut halfway is worse than
 * none — but if the engine takes four seconds the splash waits rather
 * than dumping the visitor on an empty page.
 *
 *   import { splash } from './splash.html';   // not a module; see below
 *
 * In practice a page embeds this file in an <iframe> or inlines the
 * markup and calls:
 *
 *   await window.Lattice117Splash.done(enginePromise);
 *
 * `prefers-reduced-motion` short-circuits the wait entirely, because in
 * that mode there is no sequence to finish.
 */
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

/** Total run time, read from the stylesheet so there is one source. */
function totalMs() {
  const raw = getComputedStyle(document.documentElement)
    .getPropertyValue('--t-total').trim();          // e.g. "6.4s"
  const n = parseFloat(raw);
  return raw.endsWith('ms') ? n : n * 1000;
}

const sequence = REDUCED
  ? Promise.resolve()
  : new Promise((r) => setTimeout(r, totalMs()));

window.Lattice117Splash = {
  /** Resolves when BOTH the sequence and `work` are finished. */
  done(work) {
    return Promise.all([sequence, Promise.resolve(work).catch(() => {})]);
  },
  /** The sequence alone, for a caller with nothing to wait on. */
  sequence,
  reducedMotion: REDUCED,
};

/* Standalone use: when this page is opened directly rather than embedded,
   announce completion so a recorder or a parent frame knows the frame is
   final. No navigation happens on its own — a splash that redirects is a
   splash that cannot be looked at. */
sequence.then(() => {
  document.documentElement.dataset.splash = 'complete';
  parent.postMessage({ type: 'lattice117:splash-complete' }, '*');
});
</script>
</body>
</html>
