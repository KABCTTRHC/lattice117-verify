[package]
name = "lattice117-audit"
description = "Air-gapped CLI that verifies whether a schedule produced by any planner is actually feasible."
keywords = ["scheduling", "verification", "cli", "audit", "deterministic"]
categories = ["command-line-utilities", "algorithms"]
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "lattice117-audit"
path = "src/main.rs"

[dependencies]
lattice117-verify = { path = "../lattice117-verify", version = "0.1.0" }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
