name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all

  determinism:
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing must not cancel the others. On a determinism
      # matrix the interesting information is precisely which platforms agree,
      # and fail-fast throws that away at the moment it matters most.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      # The central claim, checked on every platform: the verdict digest for a
      # given input must be identical everywhere. If these differ, determinism
      # is broken and the project's whole premise with it.
      - name: Verdict digest is platform-independent
        shell: bash
        run: |
          # The auditor exits 1 on INFEASIBLE by design - 0/1/2 is
          # feasible/infeasible/bad input, which is what makes it usable as a
          # CI gate - and this fixture is infeasible. Under GitHub's default
          # `bash -e -o pipefail` that documented exit code killed the step
          # inside the command substitution, before any digest was compared.
          # So this check could only ever fail: it went red on a correct
          # result and had never once verified anything.
          BIN=./target/release/lattice117-audit
          set +e
          OUT=$("$BIN" --input examples/infeasible.json --json)
          CODE=$?
          set -e
          echo "$OUT"
          # Assert the exit code too. "Exits 1 on infeasible" is part of the
          # published contract, so a build that started returning 0 here would
          # break every consumer using it as a gate while still printing the
          # right digest.
          if [ "$CODE" -ne 1 ]; then
            echo "::error::expected exit 1 (INFEASIBLE), got $CODE"
            exit 1
          fi
          echo "$OUT" | grep -q "611eef21de58485fe4727b74f54f4f6a06e1e1bf9567384c989a1e75b5cac085"

      # The regression this matrix actually caught. The digest is taken over
      # the input text, so before normalisation the same schedule hashed
      # differently on Windows - git rewrites LF to CRLF on checkout - and the
      # matrix reported 611eef21 on Linux and macOS against 5467faa0 on
      # Windows, with byte-identical Q16.16 integers underneath. Both endings
      # are built here from the same source so this holds on every platform,
      # whatever the checkout did.
      - name: Digest is independent of line endings
        shell: bash
        run: |
          BIN=./target/release/lattice117-audit
          tr -d '\r' < examples/infeasible.json > lf.json
          sed 's/$/\r/' lf.json > crlf.json
          get() { set +e; O=$("$BIN" --input "$1" --json); set -e
                  echo "$O" | grep -o '"verdict_digest_sha256": "[a-f0-9]*"' | cut -d'"' -f4; }
          LF=$(get lf.json)
          CRLF=$(get crlf.json)
          echo "LF   $LF"
          echo "CRLF $CRLF"
          if [ "$LF" != "$CRLF" ]; then
            echo "::error::line endings changed the verdict digest"
            exit 1
          fi
          [ "$LF" = "611eef21de58485fe4727b74f54f4f6a06e1e1bf9567384c989a1e75b5cac085" ]
          rm -f lf.json crlf.json

  # The NEON path is cfg'd to target_arch = "aarch64" and every other job here
  # runs on x86_64, so nothing compiled it. It had been broken since Rust
  # started requiring an explicit unsafe block inside `unsafe fn` - which this
  # crate opts into hard via #![forbid(unsafe_op_in_unsafe_fn)] - and the only
  # runner that noticed was macOS, once GitHub moved it to Apple Silicon.
  # cargo check does not link, so no cross-linker is needed.
  aarch64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
          components: clippy
      - run: cargo check --target aarch64-unknown-linux-gnu --all
      - run: cargo clippy --target aarch64-unknown-linux-gnu --all -- -D warnings

  # The licence check is served from three paths — the demo, the add-in and the
  # source of truth in licence/. They must be the same file. A copy that drifts
  # means one surface honours a key the other rejects, which looks to a paying
  # customer like the product is broken.
  surfaces:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Licence check is identical on every surface
        run: |
          cmp licence/licence.js demo/licence.js
          cmp licence/licence.js excel-addin/licence.js
      # The digest canonicalisation is the one thing that MUST be identical
      # everywhere: its whole purpose is two parties confirming they reached
      # the same verdict. Three surfaces once hashed three different things,
      # so the same schedule produced three different numbers.
      - name: Verdict canonicalisation is identical on every surface
        run: |
          cmp demo/digest.js excel-addin/digest.js
          cmp demo/digest.js npm/digest.js
      - name: Rota rules are identical on every surface
        run: |
          cmp demo/rota.js excel-addin/rota.js
          cmp demo/rota.js npm/rota.js
          cmp demo/freetier.js excel-addin/freetier.js
          cmp demo/freetier.js npm/freetier.js
      - name: WASM is identical on every surface
        run: |
          cmp demo/lattice117_wasm.wasm npm/lattice117_wasm.wasm
          cmp demo/lattice117_wasm.wasm excel-addin/lattice117_wasm.wasm
      # Boundary cases decide whether a lawful rota gets flagged. A false
      # positive at exactly 11 hours sends someone to rewrite a compliant
      # roster; a false negative tells them an unlawful one is fine.
      - name: Rota rest and break boundaries
        run: node tests/rota.test.mjs
      - name: Free-tier depth caps
        run: node tests/freetier.test.mjs
      # The Sheets sidebar is a BUNDLE of the shared modules. A stale bundle is
      # a surface that silently disagrees with the other three about what a
      # breach is and what the digest should be, which is the one thing the
      # product cannot survive. This rebuilds and diffs.
      - name: Sheets bundle is current, scoped and self-contained
        run: node tests/sheets.test.mjs
